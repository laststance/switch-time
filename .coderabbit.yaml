# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Kept in en-US on purpose: the coderabbit-resolver scripts pattern-match CodeRabbit's English rate-limit notices.
language: 'en-US'
reviews:
  profile: 'chill'
  # Findings are posted as "request changes"; once every comment is resolved CodeRabbit approves the PR itself.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!**/pnpm-lock.yaml'
    - '!apps/api/drizzle/**/snapshot.json'
    - '!design/**'
    - '!design-system/**'
  path_instructions:
    - path: '**/*.test.{ts,tsx}'
      instructions: |
        Vitest: `test` over `it`; // Arrange / // Act / // Assert comments; hard-coded expected values;
        test names describe the observable behaviour that breaks when they fail. Assert visibility with toBeVisible().
    - path: 'apps/app/e2e/**'
      instructions: |
        Playwright: locate by role/label, expect(locator).toBeVisible(), no fixed sleeps.
    - path: 'apps/api/drizzle/**/migration.sql'
      instructions: |
        Generated by drizzle-kit from apps/api/src/db/schema/*.ts: check the SQL matches the schema and stays safe for a
        running app (it runs as an App Platform PRE_DEPLOY job); do not request hand edits to generated files.
chat:
  auto_reply: true
