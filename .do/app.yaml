# DigitalOcean App Platform spec (MVP-09): one app serving the API under /api and the Expo web export at /,
# so the Better Auth cookie is first-party and CORS stays off. Region sgp: App Platform has no Tokyo region.
# Check: `doctl apps spec validate --schema-only .do/app.yaml`. First deploy: see README "Deploy".
name: switch-time
region: sgp

services:
  - name: api
    github:
      repo: laststance/switch-time
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${switch-time-pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${switch-time-pg.CA_CERT}
      - key: APP_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}
      # Encrypted by App Platform when the app was created from a temporary copy holding the plaintext (README "Deploy");
      # `EV[1:…]` is safe to commit and must stay here, or `doctl apps update --spec` would drop the real secret.
      - key: BETTER_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:swo7Z1Z4CbJWlEjGG4ITNiLUBhnS4k8S:redMKFiQABnxRVrUfjIWi8qia+wBo7quWDPJlYtDR3KIB0MrwdZVUjDihNXfG7JW6OZWnqTfGWEoPQAh]

jobs:
  # Same image as `api`; runs the Drizzle migrations before every deploy of the new build.
  - name: db-migrate
    kind: PRE_DEPLOY
    github:
      repo: laststance/switch-time
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    run_command: node dist/db/migrate.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${switch-time-pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${switch-time-pg.CA_CERT}

static_sites:
  - name: web
    github:
      repo: laststance/switch-time
      branch: main
      deploy_on_push: true
    source_dir: /
    # Built from a Dockerfile: the Node.js buildpack runs `pnpm install --prod=false`, which pnpm 12 rejects
    # (pnpm/pnpm#14553). App Platform copies `output_dir` out of the built image.
    dockerfile_path: apps/app/Dockerfile
    output_dir: /repo/apps/app/dist
    # Client-side routes fall back to the app shell; `apps/app/scripts/audit-web-export.mts` guards the export in CI.
    catchall_document: index.html

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

databases:
  # Managed PostgreSQL created out of band (README "Deploy"); attaching it adds the app to the cluster's trusted sources.
  - name: switch-time-pg
    cluster_name: switch-time-pg
    engine: PG
    production: true
    db_name: switchtime
    db_user: switchtime_app

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
