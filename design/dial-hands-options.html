<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
 body{margin:0;padding:26px;background:#111216;color:#F2EFE8;width:1180px;
   font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif}
 h2{font:600 11px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,239,232,.6);margin:0 0 14px}
 .row{display:flex;gap:18px;margin-bottom:26px}
 .col{flex:1;background:#1B1C22;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px;text-align:center}
 .cap{font:500 12px/1.5 inherit;color:rgba(242,239,232,.6);margin-top:12px}
 .cap b{color:#F2EFE8;font-weight:600}
</style></head><body>
<h2>Hands — 現状 / 先細り＋カウンターウェイト / バトン / スケルトン</h2>
<div class="row" id="dark"></div>
<h2>同じものを light で</h2>
<div class="row" id="light"></div>
<script>
const HD=140, MD=264, SD=42;               // 時 / 分 / 秒 の角度
const T={dark :{face:'#212229',ink:'#F2EFE8',sub:'rgba(242,239,232,0.60)',line:'rgba(255,255,255,0.14)',bgc:'#1B1C22',cur:'#3B7BD9'},
         light:{face:'#FFFFFF',ink:'#1B1A17',sub:'rgba(27,26,23,0.55)',line:'rgba(27,26,23,0.12)',bgc:'#FFFFFF',cur:'#2A66C4'}};

// 目盛り3段階（既存ロジックそのまま）
const ticks=C=>Array.from({length:60},(_,i)=>{const q=i%15===0,h=i%5===0;
  return{deg:i*6,y2:q?30:h?26:20,w:q?3:h?2:1,stroke:q?C.ink:h?C.sub:C.line};})
  .map(t=>`<line x1="100" y1="16" x2="100" y2="${t.y2}" stroke="${t.stroke}" stroke-width="${t.w}" stroke-linecap="round" transform="rotate(${t.deg} 100 100)"/>`).join('');

const SEC=C=>`<g transform="rotate(${SD} 100 100)"><line x1="100" y1="120" x2="100" y2="24" stroke="${C.cur}" stroke-width="1.2" stroke-linecap="round"/><circle cx="100" cy="116" r="3.4" fill="${C.cur}"/></g>`;
const HANDS={
 A:C=>`<line x1="100" y1="106" x2="100" y2="52" stroke="${C.ink}" stroke-width="6" stroke-linecap="round" transform="rotate(${HD} 100 100)"/>
       <line x1="100" y1="108" x2="100" y2="32" stroke="${C.ink}" stroke-width="4" stroke-linecap="round" transform="rotate(${MD} 100 100)"/>
       <line x1="100" y1="112" x2="100" y2="24" stroke="${C.cur}" stroke-width="1.5" stroke-linecap="round" transform="rotate(${SD} 100 100)"/>`,
 // B: バトン（真っ直ぐ先細り）
 B:C=>`<path d="M98.9 52 L101.1 52 L102.9 104 L97.1 104 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.4" stroke-linejoin="round" transform="rotate(${HD} 100 100)"/>
       <path d="M99.3 30 L100.7 30 L102.1 104 L97.9 104 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.2" stroke-linejoin="round" transform="rotate(${MD} 100 100)"/>${SEC(C)}`,
 // C: ドーフィン（菱形・中ほどが最も太い）
 C:C=>`<path d="M100 51 L103.2 72 L101.6 104 L98.4 104 L96.8 72 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.2" stroke-linejoin="round" transform="rotate(${HD} 100 100)"/>
       <path d="M100 29 L102.4 56 L101.3 104 L98.7 104 L97.6 56 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1" stroke-linejoin="round" transform="rotate(${MD} 100 100)"/>${SEC(C)}`,
 // D: 剣型（肩から直線的に細く）
 D:C=>`<path d="M100 50 L102.6 64 L102.6 100 L97.4 100 L97.4 64 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round" transform="rotate(${HD} 100 100)"/>
       <path d="M100 28 L101.9 44 L101.9 100 L98.1 100 L98.1 44 Z" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.3" stroke-linejoin="round" transform="rotate(${MD} 100 100)"/>${SEC(C)}`,
};
// ── 中心キャップ ─────────────────────────────────────────
const CAP={ flat:C=>`<circle cx="100" cy="100" r="4.5" fill="${C.cur}"/>`,
            jewel:C=>`<circle cx="100" cy="100" r="5.6" fill="${C.face}" stroke="${C.ink}" stroke-width="1.4"/>
                      <circle cx="100" cy="100" r="2.6" fill="${C.cur}"/>
                      <circle cx="100" cy="100" r="0.9" fill="${C.face}"/>` };

const LABELS={A:['現状','丸線・錘なし・平らなキャップ'],
              B:['バトン','真っ直ぐ先細り。最も素直'],
              C:['ドーフィン','中ほどが最も太い菱形。腕時計の定番'],
              D:['剣型','肩から直線的に細く。計器寄り']};
for (const [mode, host] of [['dark',dark],['light',light]]) {
  const C=T[mode];
  host.innerHTML = Object.keys(HANDS).map(k=>`
   <div class="col" style="background:${C.bgc};border-color:${C.line}">
    <svg viewBox="0 0 200 200" width="200" height="200">
      <circle cx="100" cy="100" r="99" fill="none" stroke="${C.cur}" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="90" fill="${C.face}" stroke="${C.line}" stroke-width="1"/>
      ${ticks(C)}${HANDS[k](C)}${(k==='A'?CAP.flat:CAP.jewel)(C)}
    </svg>
    <div class="cap" style="color:${C.sub}"><b style="color:${C.ink}">${k}. ${LABELS[k][0]}</b><br>${LABELS[k][1]}</div>
   </div>`).join('');
}
</script></body></html>
