<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design-system/styles.css">
<style>
 body{padding:28px;display:flex;flex-direction:column;gap:24px;width:1040px}
 h2{font:600 12px/1 var(--font-heading);letter-spacing:.1em;text-transform:uppercase;color:var(--color-sub);margin:0 0 10px}
 .row{display:flex;gap:24px}
 .col{flex:1;background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;padding:20px}
 .cap{font:500 11px var(--font-body);color:var(--color-sub);margin-top:10px;text-align:center}
 .spec{font:600 40px/1.15 var(--font-heading);letter-spacing:-.02em;margin:0 0 6px}
 .spec-jp{font:500 30px/1.3 var(--font-heading);margin:0 0 6px}
 .num{font:600 40px/1.1 var(--font-heading);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style></head><body>
<section><h2>Type — system stack, no webfont</h2>
 <p class="spec">Switch Time 0123456789</p>
 <p class="spec-jp">家事 仕事 休息 睡眠 食事 娯楽</p>
 <p class="num">2:47:11</p></section>

<section><h2>Dial — before / after</h2><div class="row">
 <div class="col" style="text-align:center">
  <svg viewBox="0 0 200 200" width="210" height="210" style="filter:drop-shadow(0 14px 30px rgba(0,0,0,0.12))">
   <circle cx="100" cy="100" r="98" fill="none" stroke="#3B7BD9" stroke-width="4"></circle>
   <circle cx="100" cy="100" r="90" fill="#1B1C22"></circle>
   <g id="old"></g>
   <line x1="100" y1="106" x2="100" y2="52" stroke="#F2EFE8" stroke-width="6" stroke-linecap="round" transform="rotate(140 100 100)"></line>
   <line x1="100" y1="108" x2="100" y2="32" stroke="#F2EFE8" stroke-width="4" stroke-linecap="round" transform="rotate(264 100 100)"></line>
   <circle cx="100" cy="100" r="4.5" fill="#3B7BD9"></circle></svg>
  <div class="cap">BEFORE — face=surface、drop-shadow、目盛り2段階</div></div>
 <div class="col" style="text-align:center">
  <svg viewBox="0 0 200 200" width="210" height="210">
   <circle cx="100" cy="100" r="98" fill="none" stroke="#3B7BD9" stroke-width="4"></circle>
   <circle cx="100" cy="100" r="90" fill="#212229" stroke="rgba(255,255,255,0.14)" stroke-width="1"></circle>
   <g id="new"></g>
   <line x1="100" y1="106" x2="100" y2="52" stroke="#F2EFE8" stroke-width="6" stroke-linecap="round" transform="rotate(140 100 100)"></line>
   <line x1="100" y1="108" x2="100" y2="32" stroke="#F2EFE8" stroke-width="4" stroke-linecap="round" transform="rotate(264 100 100)"></line>
   <circle cx="100" cy="100" r="4.5" fill="#3B7BD9"></circle></svg>
  <div class="cap">AFTER — face 独立値、リム1px、目盛り3段階</div></div>
</div></section>
<script>
const C={ink:'#F2EFE8',sub:'rgba(242,239,232,0.6)',line:'rgba(255,255,255,0.14)'};
const mk=(g,ts)=>ts.forEach(t=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');
 l.setAttribute('x1',100);l.setAttribute('y1',16);l.setAttribute('x2',100);l.setAttribute('y2',t.y2);
 l.setAttribute('stroke',t.stroke);l.setAttribute('stroke-width',t.w);l.setAttribute('stroke-linecap','round');
 l.setAttribute('transform',`rotate(${t.deg} 100 100)`);g.appendChild(l);});
mk(document.getElementById('old'),Array.from({length:60},(_,i)=>{const m=i%5===0;
 return{deg:i*6,y2:m?26:21,w:m?2.5:1,stroke:m?C.ink:C.line};}));
mk(document.getElementById('new'),Array.from({length:60},(_,i)=>{const q=i%15===0,h=i%5===0;
 return{deg:i*6,y2:q?30:h?26:20,w:q?3:h?2:1,stroke:q?C.ink:h?C.sub:C.line};}));
</script></body></html>
