name: Prepare
description: Install the pinned pnpm release (from packageManager), Node.js (from .node-version) and workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        install: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
