name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same major as compose.yaml and the DigitalOcean cluster; apps/api migrates it in its Vitest global setup.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: switchtime
          POSTGRES_PASSWORD: switchtime
          POSTGRES_DB: switchtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U switchtime -d switchtime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://switchtime:switchtime@localhost:5432/switchtime_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm test
      # PRE_DEPLOY runs the bundle, not the tsx source (MVP-09): prove dist/db/migrate.js loads and re-runs cleanly against the same database.
      - run: pnpm --filter api build && node apps/api/dist/db/migrate.js
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
