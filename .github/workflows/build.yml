name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      # Runs every workspace `build` script (API bundle, `expo export -p web`) as they land.
      - run: pnpm build
      # Web export guard: no CSS react-native-web cannot draw, no colour outside design-system/theme.json.
      - run: pnpm --filter app audit:web
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The images App Platform builds (.do/app.yaml): `api` + `db-migrate`, and the `web` static site; build only, nothing is pushed.
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/app/Dockerfile .
